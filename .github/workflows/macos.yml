name: macOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run tests
        run: ./scripts/test.sh
      - name: Build application
        env:
          SHIYI_SIGNING_IDENTITY: "-"
        run: ./scripts/build-app.sh
      - name: Package preview
        run: ./scripts/package-release.sh
      - name: Upload preview and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Shiyi-macOS-preview
          path: dist/*
          if-no-files-found: error
          retention-days: 14
